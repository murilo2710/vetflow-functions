name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  deploy:
    # Opcional: publica na Function App quando os secrets existem
    # (AZURE_FUNCTIONAPP_NAME e AZURE_FUNCTIONAPP_PUBLISH_PROFILE).
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_PROFILE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_PROFILE == 'true'
        run: npm install --omit=dev
      - if: env.HAS_PROFILE == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
